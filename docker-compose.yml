name: fortuna

services:
  postgres:
    image: postgres:16
    container_name: fortuna-pg
    environment:
      POSTGRES_USER: fortuna
      POSTGRES_PASSWORD: fortuna
      POSTGRES_DB: fortuna
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - fortuna-pg-data:/var/lib/postgresql/data

volumes:
  fortuna-pg-data:
    name: fortuna-pg-data
